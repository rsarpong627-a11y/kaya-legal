<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Legal — KAYA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d3d2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .logo { font-size: 36px; font-weight: 800; color: #0d3d2e; letter-spacing: -1px; }
    p { margin-top: 8px; color: #666; font-size: 15px; }
    .links { margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      display: block;
      padding: 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: opacity 0.15s;
    }
    a.btn:hover { opacity: 0.85; }
    .primary { background: #0d3d2e; color: #4ade80; }
    .secondary { background: #f0faf4; color: #0d3d2e; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">KAYA</div>
    <p>Legal documents for the KAYA delivery platform.</p>
    <div class="links">
      <a class="btn primary" href="privacy-policy.html">Privacy Policy</a>
      <a class="btn secondary" href="terms-of-service.html">Terms of Service</a>
    </div>
  </div>
</body>
</html>
